<!-- Meta Pixel: PageView + Lead. No personal data is sent. -->
<script>
  (function () {
    var PIXEL_ID = '【ピクセルID】';
    if (!/^\d+$/.test(PIXEL_ID)) return; // skip until a real pixel ID is set
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('set', 'autoConfig', false, PIXEL_ID);
    fbq('init', PIXEL_ID);
    fbq('track', 'PageView');

    // Send Lead only once, right after a real submit (not on reload or direct visit).
    // If sessionStorage is unavailable, send it anyway rather than lose the conversion.
    var sendLead = true;
    try {
      sendLead = sessionStorage.getItem('joukyo_lp_submitted') === '1';
      sessionStorage.removeItem('joukyo_lp_submitted');
    } catch (e) { sendLead = true; }
    if (sendLead) fbq('track', 'Lead');
  })();
</script>
<!-- 【AdInteの計測タグ（CV用）】 AIGeo 側で完了ページのタグが必要な場合はここに貼る -->

<style>

  .back { display: block; text-align: center; margin: 28px 0 48px; color: var(--ink-sub); font-size: 14px; }
  footer { border-top: 1px solid var(--line); padding: 20px 0 28px; text-align: center; font-size: 13px; color: var(--ink-sub); }
